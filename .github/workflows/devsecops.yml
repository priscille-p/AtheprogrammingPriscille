name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies and tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirement.txt
        pip install pip-audit bandit pytest

    # Stage 1: Run Software Tests
    - name: Run Application Tests (pytest)
      run: |
        pytest || true

    # Stage 2: Run SCA (Dependency Check)
    - name: Run SCA (pip-audit on requirement.txt)
      run: |
        pip-audit -r requirement.txt || true

    # Stage 3: Run SAST (Code Security Check)
    - name: Run SAST (Bandit on main.py)
      run: |
        bandit -r main.py || true